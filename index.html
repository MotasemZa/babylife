          {"@type":"Question","name":"How does duplicate prevention work?","acceptedAnswer":{"@type":"Answer","text":"Each item in your vault is tracked with a unique status. When a product is dispatched, it's immediately marked as 'used' and can never be sent again. If an order comes in and no available stock exists, the fulfillment is paused and you're notified—no accidental double-sends."}},
